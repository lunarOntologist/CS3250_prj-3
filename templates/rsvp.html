{% extends "base.html" %}
{% block main %}
<div class="container">
    <h1>RSVP</h1>
    <p><a href="{{ url_for('events') }}">Back to Events</a></p>

    <form method="POST">
        {{ form.hidden_tag() }}

        <div>
            {{ form.status.label }}<br>
            {{ form.status() }}
            {% for error in form.status.errors %}
                <span class="error">{{ error }}</span>
            {% endfor %}
        </div>
        <div>
            {{ form.submit() }}
        </div>
    </form>
</div>
{% endblock %}
